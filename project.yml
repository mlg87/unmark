# XcodeGen spec. Unmark.xcodeproj is generated from this file by `make project`
# and never committed, so the project file can't produce merge conflicts.
# Spec reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: Unmark

options:
  bundleIdPrefix: com.mlg87
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  UnmarkCore:
    path: Packages/UnmarkCore

targets:
  Unmark:
    type: application
    platform: macOS
    sources:
      - path: App
        # The renderer bundle is build output from `pnpm --dir renderer build`. Globbing
        # it here would flatten its files into the bundle root, so it's added below as a
        # folder reference instead.
        excludes:
          - Resources/Renderer
      # A folder reference copies Contents/Resources/Renderer/ with its layout intact, which
      # UnmarkSchemeHandler serves as unmark://app/renderer/ (#22). Optional because the
      # folder doesn't exist until the first build runs the script below.
      - path: App/Resources/Renderer
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: Build renderer
        script: '"$SRCROOT/scripts/build-renderer.sh"'
        # pnpm and esbuild decide what's stale, so the phase runs on every build.
        basedOnDependencyAnalysis: false
    dependencies:
      - package: UnmarkCore
      # The `unmark` command-line tool ships inside the app (#8). It goes in Contents/Helpers, not next to
      # the app's executable in Contents/MacOS: on case-insensitive APFS, the default for macOS volumes,
      # `unmark` and `Unmark` are the same file.
      - target: unmark-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # Keys GENERATE_INFOPLIST_FILE can't express. XcodeGen writes them to App/Info.plist on
    # `make project`, and Xcode merges that file with the generated keys.
    info:
      path: App/Info.plist
      properties:
        # XcodeGen otherwise writes 1.0 and 1 here, overriding the version build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Editor rank Default registers Unmark as a markdown handler without claiming to own
        # the type. macOS 14 has no UTType.markdown, hence the imported declaration.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              # Keep in sync with MarkdownFile.pathExtensions in UnmarkCore.
              public.filename-extension: [md, markdown, mdown, mdwn, mkd, mkdn, mkdown]
              public.mime-type: [text/markdown]
        # Remote images load over http as well as https (q28). Scoped to web content, so the
        # app's own networking keeps App Transport Security.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_NAME: Unmark
        PRODUCT_BUNDLE_IDENTIFIER: com.mlg87.unmark
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Unmark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Mason Goetz. MIT License.
        # Notarization requires the hardened runtime (ADR-0002: distributed outside the App Store).
        ENABLE_HARDENED_RUNTIME: true
        # Sign to Run Locally until the Developer ID signing work supplies a team.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: true
        SWIFT_EMIT_LOC_STRINGS: true
        # The Build renderer phase writes App/Resources/Renderer/ and runs pnpm from the
        # user's PATH, which the script sandbox blocks.
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: true
        Release:
          # Standard Architectures: one universal binary for Apple silicon and Intel.
          ONLY_ACTIVE_ARCH: false
          ARCHS: $(ARCHS_STANDARD)

  unmark-cli:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    dependencies:
      - package: UnmarkCore
    settings:
      base:
        PRODUCT_NAME: unmark
        PRODUCT_BUNDLE_IDENTIFIER: com.mlg87.unmark.cli
        # Notarization requires the hardened runtime on every executable in the app (ADR-0002).
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        # Installed only inside Unmark.app, so archives don't also copy it to /usr/local/bin.
        SKIP_INSTALL: true
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: true
        Release:
          ONLY_ACTIVE_ARCH: false
          ARCHS: $(ARCHS_STANDARD)

schemes:
  Unmark:
    build:
      targets:
        Unmark: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: UnmarkCore/UnmarkCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
