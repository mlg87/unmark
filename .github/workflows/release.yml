# Builds a signed, notarized, and stapled Unmark-<version>.dmg with scripts/release/build-dmg.sh. A run on a v<version>
# tag also publishes it: the Release PR workflow dispatches one when its release PR merges, and pushing a tag starts one.
# It generates the Sparkle appcast, which embeds the notes from CHANGELOG.md's v<version> section, publishes the DMG and
# appcast to the GitHub release v<version> with those notes, and bumps the Homebrew cask in mlg87/homebrew-tap. A
# manual run on a branch is a dry run that only uploads the DMG as a workflow artifact. docs/releasing.md lists the
# secrets this reads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version for a dry run on a branch, like 1.2.3 or 1.2.3-beta.1. A run on a v* tag uses the tag's.
        required: false
        type: string

permissions:
  contents: read

jobs:
  dmg:
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Same runner and Xcode as ci.yml.
    runs-on: macos-15
    # build-dmg.sh waits up to 90 minutes for notarization, which usually takes minutes but has taken over 30.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0

      - name: Pick the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n $INPUT_VERSION ]]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo '::error::A dry run on a branch needs the version input'
            exit 1
          fi

      # Before the build, so a tag whose commit lacks the notes fails before waiting on notarization.
      - name: Read the release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # The app target's Build renderer phase runs pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: renderer/package.json
          cache: true
          cache_dependency_path: renderer/pnpm-lock.yaml

      - name: Install XcodeGen
        run: make bootstrap

      # A temporary keychain, so the private key never touches the runner's login keychain:
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # Prepended, so codesign and xcodebuild search it ahead of the login keychain.
          existing=()
          while read -r path; do
            existing+=("${path//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, and notarize the DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release/build-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: Unmark-${{ steps.version.outputs.version }}.dmg
          path: build/release/Unmark-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error

      # After build-dmg.sh, which empties build/release.
      - name: Generate the appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          cp "$RUNNER_TEMP/release-notes.md" "build/release/Unmark-$VERSION.md"
          scripts/release/generate-appcast.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: appcast.xml
          path: build/release/appcast/appcast.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  # Its own job, so the token that can create releases never shares a runner with the build's third-party code (pnpm
  # and Swift packages), and the signing secrets never share one with that token.
  publish:
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # Not a prerelease, even for a tag like v1.2.3-rc1: the app's feed is the latest release's appcast.xml, and
      # GitHub never counts a prerelease as the latest.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.dmg.outputs.version }}
        # The generate-notes endpoint names a release after its tag, as --title does here.
        run: |
          gh release create "$GITHUB_REF_NAME" "release/Unmark-$VERSION.dmg" release/appcast.xml \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release/release-notes.md

  # Bumps the cask in mlg87/homebrew-tap to the new DMG once the release is public, so `brew install mlg87/tap/unmark`
  # gets it. TAP_DEPLOY_KEY is a write deploy key on the tap alone; a separate job keeps it off the runners that hold
  # the signing secrets or the token that can write releases.
  tap:
    needs: [dmg, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/release

      - uses: actions/checkout@v7
        with:
          repository: mlg87/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Bump the cask
        env:
          VERSION: ${{ needs.dmg.outputs.version }}
        run: |
          scripts/release/bump-tap-cask.sh tap/Casks/unmark.rb "$VERSION"
          cd tap
          if git diff --quiet; then
            echo "Casks/unmark.rb is already at $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "unmark $VERSION"
          git push
