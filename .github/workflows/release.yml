# Builds a signed, notarized, and stapled Unmark-<version>.dmg with scripts/release/build-dmg.sh. A v<version> tag
# push also generates the Sparkle appcast and publishes both to the GitHub release v<version>; a manual run
# (workflow_dispatch) is a dry run that only uploads the DMG as a workflow artifact. docs/releasing.md lists the
# secrets this reads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, like 1.2.3 or 1.2.3-beta.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  dmg:
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Same runner and Xcode as ci.yml.
    runs-on: macos-15
    # build-dmg.sh waits up to 90 minutes for notarization, which usually takes minutes but has taken over 30.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0

      - name: Pick the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # The app target's Build renderer phase runs pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: renderer/package.json
          cache: true
          cache_dependency_path: renderer/pnpm-lock.yaml

      - name: Install XcodeGen
        run: make bootstrap

      # A temporary keychain, so the private key never touches the runner's login keychain:
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # Prepended, so codesign and xcodebuild search it ahead of the login keychain.
          existing=()
          while read -r path; do
            existing+=("${path//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, and notarize the DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release/build-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: Unmark-${{ steps.version.outputs.version }}.dmg
          path: build/release/Unmark-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error

      - name: Generate the appcast
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/release/generate-appcast.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: appcast.xml
          path: build/release/appcast/appcast.xml
          if-no-files-found: error

      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  # Its own job, so the token that can create releases never shares a runner with the build's third-party code (pnpm
  # and Swift packages), and the signing secrets never share one with that token.
  publish:
    needs: dmg
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # Not a prerelease, even for a tag like v1.2.3-rc1: the app's feed is the latest release's appcast.xml, and
      # GitHub never counts a prerelease as the latest.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.dmg.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "release/Unmark-$VERSION.dmg" release/appcast.xml \
            --verify-tag --generate-notes
