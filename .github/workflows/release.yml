# Builds a signed, notarized, and stapled Unmark-<version>.dmg with scripts/release/build-dmg.sh and uploads it as a
# workflow artifact. Nothing is published yet; docs/releasing.md lists the secrets this reads.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, like 1.2.3 or 1.2.3-beta.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  dmg:
    # Same runner and Xcode as ci.yml.
    runs-on: macos-15
    # Notarization usually takes minutes, but Apple's queue can take much longer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # The app target's Build renderer phase runs pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: renderer/package.json
          cache: true
          cache_dependency_path: renderer/pnpm-lock.yaml

      - name: Install XcodeGen
        run: make bootstrap

      # A temporary keychain, so the private key never touches the runner's login keychain:
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$p12"
          # The exported .p12 holds only the leaf certificate; codesign needs the Developer ID G2 intermediate to
          # build the chain.
          curl -fsSL -o "$intermediate" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$intermediate" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # Prepended, so codesign and xcodebuild search it ahead of the login keychain.
          existing=()
          while read -r path; do
            existing+=("${path//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, and notarize the DMG
        env:
          VERSION: ${{ inputs.version }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release/build-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: Unmark-${{ inputs.version }}.dmg
          path: build/release/Unmark-${{ inputs.version }}.dmg
          if-no-files-found: error

      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
