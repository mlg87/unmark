# The `ci` job is the required status check for `main` (see README "Continuous integration").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main still gets its own green/red result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # macos-14 runners are unsupported from 2026-11-02; macos-15 ships Xcode 16.4.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # Vitest needs Node >= 22.12.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: renderer/package.json
          cache: true
          cache_dependency_path: renderer/pnpm-lock.yaml

      - name: Install renderer dependencies
        run: pnpm --dir renderer install --frozen-lockfile

      # Despite the runner-image docs, macos-15 has no swiftlint on PATH, so install both
      # tools from the Brewfile rather than relying on preinstalled software.
      - name: Install XcodeGen and SwiftLint
        run: make bootstrap

      - name: Generate Xcode project
        run: make project

      - name: Lint
        run: make lint

      - name: Renderer tests
        run: pnpm --dir renderer test

      # Fails when a dependency exceeds its entry-chunk size budget in build.mjs (#17), or
      # when KaTeX leaves its lazy chunk (unmark-1793451433078-17-487f189f).
      - name: Renderer build
        run: pnpm --dir renderer build

      - name: Swift tests
        run: make test

      # Ad-hoc signed so the build needs no secrets.
      - name: Universal Release build
        run: |
          xcodebuild -project Unmark.xcodeproj -scheme Unmark -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData \
            build CODE_SIGN_IDENTITY=-

      - name: Check universal binaries
        run: |
          app=build/DerivedData/Build/Products/Release/Unmark.app
          for binary in "$app/Contents/MacOS/Unmark" "$app/Contents/Helpers/unmark"; do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            for arch in x86_64 arm64; do
              if [[ " $archs " != *" $arch "* ]]; then
                echo "::error::$binary is missing $arch (got: $archs)"
                exit 1
              fi
            done
          done

      # Only paths that open nothing, so the check never launches the app on the runner.
      - name: Check CLI exit statuses
        run: |
          app="$PWD/build/DerivedData/Build/Products/Release/Unmark.app"
          cli="$app/Contents/Helpers/unmark"
          ln -sf "$cli" "$RUNNER_TEMP/unmark"
          expect_status() {
            local expected=$1; shift
            local status=0
            "$@" || status=$?
            if [[ $status != "$expected" ]]; then
              echo "::error::'$*' exited $status, expected $expected"
              exit 1
            fi
          }
          expect_status 2 "$cli"
          expect_status 2 "$cli" --bogus a.md
          expect_status 0 "$cli" --help
          expect_status 1 "$cli" missing.md
          [[ "$("$cli" missing.md 2>&1)" == "unmark: missing.md: No such file or directory" ]]
          # With nothing to open, --wait has no window to wait on and returns at once.
          expect_status 1 "$cli" --wait missing.md
          # Through a symlink, the tool still finds the app it's inside and reads its version.
          version="$(defaults read "$app/Contents/Info" CFBundleShortVersionString)"
          [[ "$("$RUNNER_TEMP/unmark" --version)" == "unmark $version" ]]

      # Epic #8: "`unmark a.md b.md` opens both and exits 0 immediately" (unmark-1793451428486-7-de60d292.1). Exiting
      # 0 within seconds while both documents are still open afterwards shows the tool returned without waiting on
      # their windows.
      - name: Check CLI opens two files and returns
        timeout-minutes: 5
        run: |
          app="$PWD/build/DerivedData/Build/Products/Release/Unmark.app"
          cli="$app/Contents/Helpers/unmark"
          query="$PWD/scripts/ci/open-documents.swift"
          dir="$RUNNER_TEMP/open-two"
          mkdir -p "$dir"
          printf '# a\n' > "$dir/a.md"
          printf '# b\n' > "$dir/b.md"
          cd "$dir"
          start=$(date +%s)
          status=0
          "$cli" a.md b.md || status=$?
          elapsed=$(( $(date +%s) - start ))
          echo "unmark a.md b.md exited $status after ${elapsed}s"
          if [[ $status != 0 ]]; then
            echo "::error::'unmark a.md b.md' exited $status, expected 0"
            exit 1
          fi
          # Generous for a cold launch on a runner; a tool that waited on the windows would never get here.
          if (( elapsed > 10 )); then
            echo "::error::'unmark a.md b.md' took ${elapsed}s to return"
            exit 1
          fi
          pid="$(pgrep -nf "^$app/Contents/MacOS/Unmark")" || {
            echo "::error::Unmark isn't running after 'unmark a.md b.md'"
            exit 1
          }
          swift "$query" "$pid" "$dir/a.md" "$dir/b.md"
          kill "$pid"

      # Epic #8: "`GIT_EDITOR="unmark --wait" git commit` blocks until the window closes"
      # (unmark-1793451428486-7-de60d292.2). git must still be running seconds after the app reports COMMIT_EDITMSG
      # open, and must commit the message once the window's close button is clicked. The runner image grants
      # /usr/bin/osascript Accessibility and Automation of System Events, so it can click that button.
      - name: Check git commit waits for the editor window
        timeout-minutes: 5
        run: |
          app="$PWD/build/DerivedData/Build/Products/Release/Unmark.app"
          query="$PWD/scripts/ci/open-documents.swift"
          dir="$RUNNER_TEMP/git-editor"
          bin="$RUNNER_TEMP/bin"
          log="$RUNNER_TEMP/git-commit.log"
          message="ci: commit through unmark --wait"
          mkdir -p "$dir" "$bin"
          ln -sf "$app/Contents/Helpers/unmark" "$bin/unmark"
          export PATH="$bin:$PATH"
          # The previous step's app may still be quitting; a fresh launch keeps its pid unambiguous.
          for _ in {1..20}; do
            pgrep -f "^$app/Contents/MacOS/Unmark" > /dev/null || break
            sleep 0.5
          done
          cd "$dir"
          git -c init.defaultBranch=main init -q
          git config user.name CI
          git config user.email ci@example.com
          printf 'x\n' > file.txt
          git add file.txt
          GIT_EDITOR="unmark --wait" git commit > "$log" 2>&1 &
          git_pid=$!
          fail() {
            echo "::error::$1"
            cat "$log"
            exit 1
          }
          pid=""
          for _ in {1..60}; do
            pid="$(pgrep -nf "^$app/Contents/MacOS/Unmark")" && break
            sleep 0.5
          done
          [[ -n $pid ]] || fail "Unmark isn't running after 'GIT_EDITOR=\"unmark --wait\" git commit'"
          swift "$query" "$pid" "$dir/.git/COMMIT_EDITMSG" || fail "Unmark never reported COMMIT_EDITMSG open"
          sleep 5
          kill -0 "$git_pid" 2> /dev/null || fail "git commit returned while COMMIT_EDITMSG was still open"
          echo "git commit still blocked 5 s after COMMIT_EDITMSG opened"
          # Stands in for the user typing the message and saving; the unedited document reloads it without asking.
          printf '%s\n' "$message" > "$dir/.git/COMMIT_EDITMSG"
          sleep 1
          osascript <<EOF
          tell application "System Events"
            tell (first process whose unix id is $pid)
              click (first button of (first window whose name is "COMMIT_EDITMSG") whose subrole is "AXCloseButton")
            end tell
          end tell
          EOF
          for _ in {1..20}; do
            kill -0 "$git_pid" 2> /dev/null || break
            sleep 0.5
          done
          kill -0 "$git_pid" 2> /dev/null && fail "git commit still blocked 10 s after the window closed"
          status=0
          wait "$git_pid" || status=$?
          cat "$log"
          [[ $status == 0 ]] || fail "git commit exited $status after the window closed"
          subject="$(git log -1 --format=%s)"
          [[ $subject == "$message" ]] || fail "git committed '$subject', expected '$message'"
          kill "$pid"
