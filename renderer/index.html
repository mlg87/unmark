<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- github-markdown-css switches light/dark via prefers-color-scheme (q8); this lets the page canvas follow too. -->
    <meta name="color-scheme" content="light dark" />
    <title>Unmark Preview</title>
    <link rel="stylesheet" href="github-markdown.css" />
    <link rel="stylesheet" href="highlight.css" />
    <!-- Layout from github-markdown-css's README, matching github.com's README width. -->
    <style>
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px;
      }

      @media (max-width: 767px) {
        .markdown-body {
          padding: 15px;
        }
      }
    </style>
    <script type="module" src="unmark.js"></script>
  </head>
  <body>
    <article class="markdown-body"></article>
  </body>
</html>
