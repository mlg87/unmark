<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unmark: Markdown, the way GitHub shows it</title>
    <meta
      name="description"
      content="Unmark is a lightweight Mac app for reading and editing markdown files, rendered the way GitHub renders them."
    />
    <link rel="canonical" href="https://unmarkeditor.com/" />
    <meta name="theme-color" content="#02163B" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://unmarkeditor.com/" />
    <meta property="og:title" content="Unmark: Markdown, the way GitHub shows it" />
    <meta
      property="og:description"
      content="Unmark is a lightweight Mac app for reading and editing markdown files, rendered the way GitHub renders them."
    />
    <meta property="og:image" content="https://unmarkeditor.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Unmark logo: a pink and coral hash mark beside the word unmark"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Picks pinned scenes before first paint, so the sheet layout never jumps. The prerendered
         HTML never has the attribute, so without JavaScript every visitor gets the static layout (#183). -->
    <script>
      if (matchMedia("(min-width: 900px) and (prefers-reduced-motion: no-preference)").matches) {
        document.documentElement.dataset.motion = "pinned";
      }
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
